name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [sdk/dart, tools/validator]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - working-directory: tools/validator
        run: |
          dart pub get
          dart run bin/validate.dart ../../spec/examples/*.nano ../../conformance/fixtures/*.nano
          dart compile exe ../../sdk/dart/example/example_cli.dart -o /tmp/example_cli
          dart run bin/validate.dart --cli /tmp/example_cli

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
